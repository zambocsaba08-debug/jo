
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Ismerd meg a GitHub működését, a Git alapjait és a közös fejlesztést!"
    >

    <title>GitHub egyszerűen – Útmutató kezdőknek</title>

    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-light: #1f2937;
            --text: #e6edf3;
            --muted: #9da7b3;
            --line: #30363d;
            --green: #3fb950;
            --blue: #58a6ff;
            --purple: #bc8cff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        nav {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .logo {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #f0f6fc;
            color: #0d1117;
            font-size: 21px;
            font-weight: 900;
        }

        .navlinks {
            display: flex;
            gap: 22px;
            color: var(--muted);
            font-size: 0.94rem;
        }

        .navlinks a:hover {
            color: var(--text);
        }

        .menu-btn {
            display: none;
            border: 1px solid var(--line);
            color: var(--text);
            background: var(--panel);
            border-radius: 8px;
            padding: 7px 11px;
            cursor: pointer;
        }

        .hero {
            padding: 92px 0 74px;
            overflow: hidden;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            right: -130px;
            top: -120px;
            background: radial-gradient(
                circle,
                rgba(88, 166, 255, 0.16),
                transparent 68%
            );
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid #285c3a;
            color: #7ee787;
            background: rgba(63, 185, 80, 0.08);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 650;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.8rem);
            line-height: 1.08;
            letter-spacing: -2px;
            margin: 22px 0;
            max-width: 780px;
        }

        .gradient {
            background: linear-gradient(
                90deg,
                #58a6ff,
                #bc8cff 60%,
                #7ee787
            );
            color: transparent;
            background-clip: text;
        }

        .hero p {
            max-width: 680px;
            color: var(--muted);
            font-size: 1.13rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px 17px;
            border-radius: 9px;
            border: 1px solid var(--line);
            font-weight: 700;
            transition:
                transform 0.18s,
                border-color 0.18s;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--blue);
        }

        .btn-primary {
            background: #238636;
            color: white;
            border-color: #238636;
        }

        .terminal {
            max-width: 760px;
            margin-top: 42px;
            background: #010409;
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.25);
        }

        .terminal-head {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--line);
        }
    </style>
</head>
<body>

    <!-- A dokumentum további HTML-tartalma itt következik. -->

</body>
</html>
